<div class="img-row{% if reverse %} img-row-reverse{% endif %}"

    >
    {% for path in paths %}
    <img 
        src="{{ get_url(path=page.path ~ path) }}"
        alt="{{ alts[loop.index0] }}"
        {%- if img_style -%}
        style="{{ img_style }}"
        {%- endif -%}
    />
    {% endfor %}
</div>
